<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommend | MyRestaurant</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Shared header and navigation (same on every page; only the "active" class moves) -->
  <header class="site-header">
    <a class="brand" href="index.html"><img src="images/logo.png" alt="MyRestaurant"></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="restaurants.html">Restaurants</a>
      <a href="recommend.html" class="active" aria-current="page">Recommend</a>
      <a href="register.html">Register</a>
      <a href="reservation.html">Reserve</a>
    </nav>
  </header>

  <main>
    <section class="page-title">
      <h1>Find the right restaurant for you</h1>
    </section>

    <section>
      <h2>Tell us what you like</h2>

      <!-- Recommendation form: the user picks a diet, a budget and a dining purpose -->
      <form id="recommend-form" novalidate>

        <label for="diet">Dietary preference</label>
        <select id="diet" name="diet">
          <option value="">-- Select --</option>
          <option value="halal">Halal</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="none">None</option>
        </select>
        <p class="error-message" id="diet-rec-error"></p>

        <label for="budget">Budget per person</label>
        <select id="budget" name="budget">
          <option value="">-- Select --</option>
          <option value="20">Up to RM 20</option>
          <option value="35">Up to RM 35</option>
          <option value="50">Up to RM 50</option>
          <option value="100">Above RM 50</option>
        </select>
        <p class="error-message" id="budget-error"></p>

        <label for="purpose">Dining purpose</label>
        <select id="purpose" name="purpose">
          <option value="">-- Select --</option>
          <option value="family">Family</option>
          <option value="date">Date</option>
          <option value="business">Business</option>
        </select>
        <p class="error-message" id="purpose-error"></p>

        <button type="submit" class="btn">Recommend</button>
      </form>

      <!-- JavaScript writes the recommended restaurants here -->
      <div id="recommend-results" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 MyRestaurant. COS10005 Assignment 2. Muhammad Aasif</p>
    <!-- Contact details  -->
    <p>For more info, please contact us:</p>
    <p>Phone: 012-345 6789 | Email: info@myrestaurant.gmail.com.my | Instagram: @myrestaurant.kk</p>
  </footer>

  <script src="js/script.js"></script>
</body>

</html>
